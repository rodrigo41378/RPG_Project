  <line x1="64" y1="165" x2="136" y2="165" stroke="#4a2a7a" stroke-width="1" opacity="0.5"/>
  <!-- Shoulders / upper body -->
  <path d="M72 115 Q60 105 62 92 Q65 80 75 78 Q100 72 125 78 Q135 80 138 92 Q140 105 128 115Z" fill="#3a2255"/>
  <!-- Neck -->
  <rect x="93" y="92" width="14" height="12" rx="3" fill="#c8a87a"/>
  <!-- Head -->
  <ellipse cx="100" cy="72" rx="20" ry="22" fill="#c8a87a"/>
  <!-- Face -->
  <ellipse cx="93" cy="70" rx="3" ry="3.5" fill="#2a1a0a" opacity="0.8"/>
  <ellipse cx="107" cy="70" rx="3" ry="3.5" fill="#2a1a0a" opacity="0.8"/>

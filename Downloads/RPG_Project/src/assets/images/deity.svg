  <circle cx="100" cy="108" r="16" fill="#1a1428" opacity="0.8"/>
  <circle cx="100" cy="108" r="14" fill="none" stroke="#d97707" stroke-width="1.5" opacity="0.7"/>
  <circle cx="100" cy="108" r="8" fill="#d97707" opacity="0.2"/>
  <circle cx="100" cy="108" r="4" fill="#f59e0b" opacity="0.7"/>

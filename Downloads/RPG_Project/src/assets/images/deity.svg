  <ellipse cx="93" cy="70" rx="2" ry="2.5" fill="#f59e0b" opacity="0.6"/>
  <ellipse cx="107" cy="70" rx="2" ry="2.5" fill="#f59e0b" opacity="0.6"/>
  <!-- Nose -->
  <path d="M99 75 Q100 78 101 75" stroke="#a88060" stroke-width="1.5" fill="none"/>
  <!-- Mouth -->
  <path d="M94 82 Q100 86 106 82" stroke="#a06040" stroke-width="1.5" fill="none"/>
  <!-- Hair -->
  <path d="M80 60 Q82 45 100 43 Q118 45 120 60 Q118 50 100 48 Q82 50 80 60Z" fill="#2a1a08"/>
  <!-- Crown / tiara -->
  <path d="M80 56 L85 44 L90 52 L95 40 L100 50 L105 40 L110 52 L115 44 L120 56" stroke="#d97707" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <circle cx="100" cy="50" r="3" fill="#60a5fa"/>
  <circle cx="90" cy="52" r="2" fill="#d97707"/>
  <circle cx="110" cy="52" r="2" fill="#d97707"/>

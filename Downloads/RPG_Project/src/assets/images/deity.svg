<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="dbg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1428"/>
      <stop offset="100%" stop-color="#051424"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#dbg)"/>
  <rect width="200" height="200" fill="url(#halo)"/>
  <!-- Divine rays -->
  <g opacity="0.15" stroke="#f59e0b" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="5"/>
    <line x1="100" y1="40" x2="130" y2="12"/>
    <line x1="100" y1="40" x2="152" y2="28"/>
    <line x1="100" y1="40" x2="165" y2="52"/>
    <line x1="100" y1="40" x2="70" y2="12"/>
    <line x1="100" y1="40" x2="48" y2="28"/>
    <line x1="100" y1="40" x2="35" y2="52"/>
  </g>
  <!-- Halo ring -->
  <circle cx="100" cy="65" r="28" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.7"/>
  <circle cx="100" cy="65" r="32" fill="none" stroke="#d97707" stroke-width="0.8" opacity="0.4"/>
  <!-- Robe body -->
  <path d="M70 115 Q65 145 58 185 L142 185 Q135 145 130 115Z" fill="#2a1a4a"/>

  <line x1="38" y1="127" x2="90" y2="125" stroke="#4a3020" stroke-width="0.8" opacity="0.4"/>
  <line x1="38" y1="136" x2="90" y2="135" stroke="#4a3020" stroke-width="0.8" opacity="0.4"/>

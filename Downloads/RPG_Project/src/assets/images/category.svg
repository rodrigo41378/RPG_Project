  <line x1="110" y1="97" x2="162" y2="100" stroke="#4a3020" stroke-width="0.8" opacity="0.6"/>
  <line x1="110" y1="107" x2="162" y2="109" stroke="#4a3020" stroke-width="0.8" opacity="0.5"/>
  <line x1="110" y1="116" x2="162" y2="118" stroke="#4a3020" stroke-width="0.8" opacity="0.5"/>
  <line x1="110" y1="125" x2="162" y2="127" stroke="#4a3020" stroke-width="0.8" opacity="0.4"/>
  <line x1="110" y1="135" x2="162" y2="136" stroke="#4a3020" stroke-width="0.8" opacity="0.4"/>

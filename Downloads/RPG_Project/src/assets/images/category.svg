  <text x="148" y="113" font-size="10" fill="#d97707" text-anchor="middle" opacity="0.6">ᚷ</text>
  <text x="136" y="128" font-size="10" fill="#d97707" text-anchor="middle" opacity="0.7">ᚨ</text>
  <text x="124" y="113" font-size="10" fill="#d97707" text-anchor="middle" opacity="0.6">ᚠ</text>

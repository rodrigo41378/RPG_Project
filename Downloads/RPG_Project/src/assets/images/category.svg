<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="cbg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a1628"/>
      <stop offset="100%" stop-color="#051424"/>

<ion-content [fullscreen]="true" class="ion-no-padding">

  <header class="page-header">
    <div class="flex items-center gap-2">
      <button (click)="goBack()" class="icon-btn"><span class="material-symbols-outlined">arrow_back</span></button>
      <h1 class="font-display text-base font-bold text-amber">Meu Perfil</h1>
    </div>
    <button (click)="openAbout()" class="icon-btn">
      <span class="material-symbols-outlined" style="color:#d4e4fa">settings</span>
    </button>
  </header>

  <main class="page-body px-4">

    <!-- Avatar -->
    <div class="avatar-row">
      <div class="avatar-wrap">
        <span class="material-symbols-outlined avatar-icon" style="font-variation-settings:'FILL' 1">account_circle</span>
      </div>
      <div class="avatar-info">
        <h2>Aventureiro</h2>
        <p>Nível {{ level }} · Classe desconhecida</p>
        <span class="xp-text">{{ xp }} / {{ xpMax }} XP</span>
        <div class="xp-bar"><div class="xp-fill" [style.width.%]="xpPercent"></div></div>
      </div>
    </div>

    <!-- Atributos -->
    <div class="glass-card rounded-2xl p-4 mb-4">
      <h3 class="section-label">
        <span class="material-symbols-outlined" style="font-size:18px;color:#f59e0b">bar_chart</span>
        Atributos
      </h3>
      <div class="stats-grid">
        <div *ngFor="let s of stats" class="stat-box">
          <span class="material-symbols-outlined stat-icon" style="font-variation-settings:'FILL' 1">{{ s.icon }}</span>
          <strong>{{ s.value }}</strong>
          <small>{{ s.label }}</small>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div class="glass-card rounded-2xl p-4 mb-4">
      <h3 class="section-label">
        <span class="material-symbols-outlined" style="font-size:18px;color:#f59e0b">military_tech</span>
        Status
      </h3>
      <div class="status-row">
        <span class="flex items-center gap-1">
          <span class="material-symbols-outlined" style="font-size:16px;color:rgba(212,228,250,.5)">workspace_premium</span>
          Rank
        </span>
        <span class="text-amber font-bold">Iniciante</span>
      </div>
      <div class="status-row" style="margin-bottom:0">
        <span class="flex items-center gap-1">
          <span class="material-symbols-outlined" style="font-size:16px;color:rgba(212,228,250,.5)">label</span>
          Título
        </span>
        <span class="text-white">Despertar Fraco</span>
      </div>
    </div>

    <!-- Ações -->
    <div class="actions-list">
      <button *ngFor="let action of actions"
              (click)="doAction(action)"
              class="action-btn">
        <div class="action-icon-wrap">
          <span class="material-symbols-outlined" style="color:#f59e0b;font-size:22px;font-variation-settings:'FILL' 1">{{ action.icon }}</span>
        </div>
        <span class="action-label">{{ action.label }}</span>
        <span class="material-symbols-outlined" style="color:rgba(212,228,250,.3);font-size:20px">chevron_right</span>
      </button>
    </div>

  </main>

  <app-bottom-nav></app-bottom-nav>

</ion-content>
